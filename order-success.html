<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"

<title>Order Successful | VETHA DESIGN</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    background: #050b10;
    color: white;

    font-family: Arial, sans-serif;
}


/* =========================
   TOP BAR
========================= */

.top-bar {
    position: fixed;

    top: 0;
    left: 0;

    width: 100%;

    height: 64px;

    padding: 8px 12px;

    display: flex;

    gap: 10px;

    align-items: center;

    justify-content: center;

    background: #050b10;

    border-bottom: 1px solid
        rgba(0,212,255,0.18);

    z-index: 9999;
}


/* TOP BUTTONS */

.top-button {
    flex: 1;

    max-width: 240px;

    height: 46px;

    display: flex;

    align-items: center;

    justify-content: center;

    border-radius: 10px;

    text-decoration: none;

    font-size: 10px;

    font-weight: bold;

    letter-spacing: 1px;

    transition: 0.2s;
}

.top-button:active {
    transform: scale(0.96);
}


/* WHATSAPP */

.whatsapp {
    background: #25D366;

    color: white;
}


/* CONTACT */

.contact-button {

    background: #0d1d27;

    border: 1px solid
        rgba(0,212,255,0.3);

    color: #00d4ff;
}


/* =========================
   MAIN
========================= */

.container {

    width: 100%;

    max-width: 520px;

    padding: 18px;

    padding-top: 82px;

    margin: 0 auto;
}


/* =========================
   CARD
========================= */

.card {

    padding: 28px 18px;

    background: #0b1820;

    border: 1px solid
        rgba(0,212,255,0.2);

    border-radius: 18px;

    box-shadow:
        0 15px 45px
        rgba(0,0,0,0.4);
}


/* =========================
   SUCCESS ICON
========================= */

.success-icon {

    width: 70px;

    height: 70px;

    margin: 0 auto 18px;

    display: flex;

    align-items: center;

    justify-content: center;

    border-radius: 50%;

    border: 2px solid #00d4ff;

    color: #00d4ff;

    font-size: 35px;
}


/* =========================
   HEADER
========================= */

.brand {

    text-align: center;

    color: #00d4ff;

    font-size: 9px;

    letter-spacing: 3px;
}

h1 {

    margin: 8px 0 6px;

    text-align: center;

    font-size: 26px;
}

.subtitle {

    margin: 0 0 22px;

    text-align: center;

    color: #81939d;

    font-size: 10px;
}


/* =========================
   ORDER NUMBER
========================= */

.order-number {

    padding: 16px;

    margin-bottom: 16px;

    text-align: center;

    background: #07131b;

    border-radius: 10px;

    border: 1px solid
        rgba(0,212,255,0.18);
}

.order-label {

    display: block;

    margin-bottom: 7px;

    color: #718592;

    font-size: 8px;

    letter-spacing: 2px;
}

#orderNumber {

    color: #00d4ff;

    font-size: 21px;

    font-weight: bold;

    letter-spacing: 1px;
}


/* =========================
   DETAILS
========================= */

.details {

    padding: 14px;

    margin-bottom: 18px;

    background: #07131b;

    border-radius: 10px;
}

.detail {

    display: flex;

    justify-content: space-between;

    gap: 15px;

    padding: 10px 0;

    border-bottom: 1px solid
        rgba(255,255,255,0.06);

    font-size: 10px;
}

.detail:last-child {

    border-bottom: none;
}

.detail-label {

    color: #718592;
}

.detail-value {

    max-width: 65%;

    color: white;

    font-weight: bold;

    text-align: right;

    word-break: break-word;
}


/* =========================
   CUSTOMER
========================= */

.customer-title {

    margin-bottom: 10px;

    color: #00d4ff;

    font-size: 8px;

    letter-spacing: 2px;
}

.address {

    margin-top: 10px;

    padding: 12px;

    background: #07131b;

    border-radius: 9px;

    color: #d7e0e4;

    font-size: 10px;

    line-height: 1.6;
}


/* =========================
   HOME BUTTON
========================= */

.home {

    width: 100%;

    min-height: 50px;

    display: flex;

    align-items: center;

    justify-content: center;

    margin-top: 10px;

    border-radius: 10px;

    background: #0d1d27;

    border: 1px solid
        rgba(0,212,255,0.2);

    color: #00d4ff;

    text-decoration: none;

    font-size: 9px;

    font-weight: bold;

    letter-spacing: 1px;

    transition: 0.2s;
}

.home:active {

    transform: scale(0.97);
}


/* =========================
   FOOTER
========================= */

.footer {

    margin-top: 20px;

    text-align: center;

    color: #607783;

    font-size: 7px;

    letter-spacing: 1px;
}
