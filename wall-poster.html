<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Wall Posters | VETHA DESIGN</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;

    min-height: 100vh;

    background: #050b10;

    color: white;

    font-family: Arial, sans-serif;
}

.page {
    width: 100%;

    max-width: 650px;

    min-height: 100vh;

    margin: auto;

    padding: 20px 14px;

    display: flex;

    flex-direction: column;
}


/* HEADER */

.header {
    display: flex;

    align-items: center;

    gap: 12px;
}

.back {
    width: 38px;

    height: 38px;

    display: flex;

    align-items: center;

    justify-content: center;

    border-radius: 50%;

    background: #0d1d27;

    color: #00d4ff;

    text-decoration: none;

    font-size: 20px;
}

.brand {
    color: #00d4ff;

    font-size: 8px;

    letter-spacing: 2px;
}

.header h1 {
    margin: 3px 0 0;

    font-size: 22px;
}


/* CONTENT */

.content {
    flex: 1;

    display: flex;

    align-items: center;

    justify-content: center;

    text-align: center;

    padding: 30px 10px;
}

.card {
    width: 100%;

    max-width: 430px;

    padding: 40px 25px;

    border-radius: 18px;

    background: #0b1820;

    border: 1px solid
        rgba(0,212,255,0.18);

    box-shadow:
        0 15px 45px
        rgba(0,0,0,0.3);
}


/* ICON */

.icon {
    width: 70px;

    height: 70px;

    margin: 0 auto 20px;

    display: flex;

    align-items: center;

    justify-content: center;

    border-radius: 50%;

    background:
        rgba(0,212,255,0.08);

    border: 1px solid
        rgba(0,212,255,0.25);

    color: #00d4ff;

    font-size: 30px;
}


/* TEXT */

.label {
    color: #00d4ff;

    font-size: 8px;

    letter-spacing: 2px;

    margin-bottom: 10px;
}

.card h2 {
    margin: 0 0 12px;

    font-size: 27px;
}

.card p {
    margin: 0;

    color: #8a9ca6;

    font-size: 11px;

    line-height: 1.7;
}

.sorry {
    margin-top: 20px;

    color: #d9e4e9;

    font-size: 13px;

    font-weight: bold;
}


/* FOOTER */

.footer {
    padding-top: 20px;

    text-align: center;

    color: #607783;

    font-size: 7px;
}

</style>

</head>


<body>


<div class="page">


    <!-- HEADER -->

    <header class="header">

        <a
            href="products.html"
            class="back">

            ←

        </a>

        <div>

            <div class="brand">
                VETHA DESIGN
            </div>

            <h1>
                Wall Posters
            </h1>

        </div>

    </header>


    <!-- MESSAGE -->

    <main class="content">

        <div class="card">


            <div class="icon">
                🖼
            </div>


            <div class="label">
                WALL POSTER
            </div>


            <h2>
                Out of Stock
            </h2>


            <p class="sorry">
                Sorry!
            </p>


            <p>
                Wall Posters are currently
                out of stock.
                <br><br>
                Please come again later.
                We’ll update this section
                when they are available.
            </p>


        </div>

    </main>


    <footer class="footer">

        VETHA DESIGN · FLEX & FRAME

    </footer>


</div>


</body>

</html>
